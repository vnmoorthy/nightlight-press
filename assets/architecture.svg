<text x="1014" y="546" class="t">🧠 Agents are sessions, not daemons</text>
<text x="1014" y="566" class="s">each desk = one Naïve session with an output_schema,</text>
<text x="1014" y="583" class="s">started in one step and collected in a later one (resumable phases).</text>
<text x="1014" y="600" class="s">Code validates the JSON, retries, and decides what happens next.</text>
<text x="1528" y="618" class="tag" text-anchor="end" fill="#B9A7FF">MODELS WRITE · CODE DECIDES</text>
</g>
<g><rect x="324" y="648" width="1216" height="100" rx="14" fill="#1d2547" stroke="#E8B44A" stroke-width="2"/>
<rect x="324" y="648" width="6" height="100" rx="3" fill="#E8B44A"/>
<text x="340" y="674" class="t">📈 What makes it a company, not a demo</text>
<text x="340" y="694" class="s">$19 a book; cost per book ≈ $0.12 in paintings + ~$0.01 in agent time → &gt;90% gross margin. Free changes forever.</text>
<text x="340" y="711" class="s">Families talk to it by email; it answers. It phones people. It markets itself nightly. It keeps books. Humans are logged as interventions.</text>
<text x="340" y="728" class="s">The goal on the board is zero interventions.</text>
<text x="1528" y="738" class="tag" text-anchor="end" fill="#E8B44A">UNIT ECONOMICS</text>
</g>
