name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Check and build the app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax-check every server and browser script
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find src public/js -name '*.js' -print0)
          echo "node --check passed on $count files"

      - name: Compile prompts, migrations and fonts
        run: node gen-prompts.mjs

      - name: Bundle for serverless hosting
        run: node build.mjs
